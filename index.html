<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pterodactyl Tracker</title>
<meta name="description" content="Strange, unexplained photos and videos people have caught on camera: pterodactyl sightings, UFOs, cryptids, ghosts and lights in the sky.">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--surface:#fffdf8;--ink:#1f1b16;--muted:#6d655a;--line:#e4ddcf;--soft:#efe9dd;--accent:#b5541f;
  --ptero:#b5541f;--ufo:#2e7d6b;--cryptid:#6b4f2a;--ghost:#5b5f97;--sky:#2f6fa8;--strange:#8a3b6b;
  --f-display:"Fraunces",Georgia,serif;--f-body:"Inter",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13110e;--surface:#1c1914;--ink:#efe8dc;--muted:#a89e8f;--line:#332d25;--soft:#26211b;--accent:#f0915a;
  --ptero:#f0915a;--ufo:#4fd1a5;--cryptid:#d4a86a;--ghost:#a5a9e8;--sky:#7fb8e8;--strange:#e08abf}}
:root[data-theme="dark"]{--bg:#13110e;--surface:#1c1914;--ink:#efe8dc;--muted:#a89e8f;--line:#332d25;--soft:#26211b;--accent:#f0915a;
  --ptero:#f0915a;--ufo:#4fd1a5;--cryptid:#d4a86a;--ghost:#a5a9e8;--sky:#7fb8e8;--strange:#e08abf}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
a{color:inherit}
button{font:inherit;color:inherit}
header{max-width:1400px;margin:0 auto;padding:22px 16px 8px;display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font:700 clamp(1.8rem,4.5vw,2.6rem)/1.05 var(--f-display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.tag{color:var(--muted);margin-top:6px;max-width:60ch}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.85rem;color:var(--muted)}
.stat b{font-family:var(--f-mono);color:var(--ink);font-size:1.05rem;margin-right:4px}
.controls{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);padding:5px 12px;border-radius:999px;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip small{font-family:var(--f-mono);opacity:.7}
.sw{width:10px;height:10px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 14px;font-size:.86rem;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
input[type=search]{font:inherit;font-size:.9rem;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);min-width:0;flex:1 1 180px;max-width:340px}
.layout{max-width:1400px;margin:0 auto;padding:6px 16px 32px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;align-content:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{position:relative;aspect-ratio:4/3;background:var(--soft)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;inset:auto auto 8px 8px;background:rgba(0,0,0,.65);color:#fff;font-size:.75rem;padding:2px 8px;border-radius:999px}
.cat{position:absolute;top:8px;left:8px;color:#fff;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h3{font-size:.92rem;font-weight:600;margin:0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:.78rem;color:var(--muted);margin-top:auto}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}
.more{grid-column:1/-1;justify-self:center}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 18px;border-radius:8px;font-weight:600;cursor:pointer}
aside{min-width:0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:12px}
.box h2{font:600 1.05rem var(--f-display);margin:0 0 8px}
.news{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;max-height:75vh;overflow:auto}
.news a{text-decoration:none;font-size:.88rem;font-weight:500;line-height:1.35}
.news a:hover{text-decoration:underline}
.news div{font-size:.76rem;color:var(--muted)}
footer{max-width:1400px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:.8rem}
dialog{border:0;padding:0;background:transparent;max-width:min(96vw,1100px);width:100%}
dialog::backdrop{background:rgba(0,0,0,.85)}
.lb{background:var(--surface);border-radius:12px;overflow:hidden}
.lb .media{background:#000;display:flex;justify-content:center}
.lb img{max-width:100%;max-height:75vh;display:block}
.lb iframe{width:100%;aspect-ratio:16/9;border:0;display:block}
.lb .cap{padding:12px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.lb .cap a{color:var(--accent);font-weight:600}
.lb .x{border:1px solid var(--line);background:none;border-radius:8px;padding:4px 12px;cursor:pointer}
@media (max-width:900px){.layout{grid-template-columns:1fr}.box{position:static}.news{max-height:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Pterodactyl <span>Tracker</span></h1>
    <div class="tag">Strange, unexplained photos and videos people have caught on camera: pterodactyl sightings, UFOs, cryptids, ghosts and lights in the sky. Collected from Reddit, unverified, and updated every few hours.</div>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="controls">
  <div id="cats" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  <div class="seg" id="kind" role="group" aria-label="Media type">
    <button data-k="all" aria-pressed="true">All</button><button data-k="image" aria-pressed="false">Photos</button><button data-k="video" aria-pressed="false">Videos</button>
  </div>
  <div class="seg" id="sort" role="group" aria-label="Sort">
    <button data-s="new" aria-pressed="true">Newest</button><button data-s="top" aria-pressed="false">Most liked</button>
  </div>
  <input type="search" id="q" placeholder="Search sightings…" aria-label="Search">
</div>
<div class="layout">
  <main class="grid" id="grid"><div class="empty">Loading sightings…</div></main>
  <aside><div class="box"><h2>In the news</h2><ul class="news" id="news"></ul></div></aside>
</div>
<footer id="foot"></footer>
<dialog id="lb"><div class="lb"><div class="media" id="lbm"></div><div class="cap"><div id="lbc"></div><div><a id="lbl" target="_blank" rel="noopener">Open original</a> &nbsp; <button class="x" id="lbx">Close</button></div></div></div></dialog>
<script>
const CATS={pterodactyl:["Pterodactyl sightings","--ptero"],ufo:["UFOs & UAPs","--ufo"],cryptid:["Cryptids","--cryptid"],
  ghost:["Ghosts","--ghost"],sky:["Sky phenomena","--sky"],strange:["Just strange","--strange"]};
const st={cat:null,kind:"all",sort:"new",q:"",shown:60};let D={items:[],news:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=d=>{const s=(Date.now()-new Date(d))/1e3;return s<3600?Math.max(1,s/60|0)+"m ago":s<86400?(s/3600|0)+"h ago":s<2592e3?(s/86400|0)+"d ago":new Date(d).toLocaleDateString()};
function filtered(){
  const q=st.q.toLowerCase();
  let xs=D.items.filter(i=>(!st.cat||i.cat===st.cat)&&(st.kind==="all"||i.kind===st.kind)&&(!q||(i.title+" "+i.text+" "+i.src).toLowerCase().includes(q)));
  return st.sort==="top"?xs.sort((a,b)=>b.score-a.score||b.date.localeCompare(a.date)):xs;
}
function render(){
  const xs=filtered(),g=$("grid");
  if(!xs.length){g.innerHTML='<div class="empty">Nothing strange matches. Yet.</div>';return}
  g.innerHTML=xs.slice(0,st.shown).map((i,n)=>{const [lab,col]=CATS[i.cat]||CATS.strange;
    return `<button class="card" data-n="${n}"><div class="thumb"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(i.thumb)}" alt="" onerror="this.style.visibility='hidden'">
    <span class="cat" style="background:var(${col})">${lab}</span>${i.kind==="video"?'<span class="play">▶ video</span>':""}</div>
    <div class="body"><h3>${esc(i.title)}</h3><div class="meta">${esc(i.src)} · ${ago(i.date)}</div></div></button>`}).join("")+
    (xs.length>st.shown?`<div class="more"><button class="btn" id="more">Show more (${xs.length-st.shown})</button></div>`:"");
  g.querySelectorAll(".card").forEach(c=>c.onclick=()=>open_(xs[+c.dataset.n]));
  const m=$("more");if(m)m.onclick=()=>{st.shown+=60;render()};
}
function open_(i){
  const isImg=i.kind==="image"&&/\.(jpe?g|png|webp)(\?|$)|cdn\.bsky\.app|i\.redd\.it|i\.imgur\.com/i.test(i.media);
  if(!i.yt&&!isImg){window.open(i.url,"_blank","noopener");return}
  $("lbm").innerHTML=i.yt?`<iframe src="https://www.youtube-nocookie.com/embed/${esc(i.yt)}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`
    :`<img referrerpolicy="no-referrer" src="${esc(i.media)}" alt="${esc(i.title)}">`;
  $("lbc").textContent=`${i.title} (${i.src})`;$("lbl").href=i.url;$("lb").showModal();
}
$("lbx").onclick=()=>$("lb").close();
$("lb").addEventListener("close",()=>$("lbm").innerHTML="");
$("lb").onclick=e=>{if(e.target===$("lb"))$("lb").close()};
function chips(){
  const n={};D.items.forEach(i=>n[i.cat]=(n[i.cat]||0)+1);
  $("cats").innerHTML=[`<button class="chip" data-c="" aria-pressed="${!st.cat}">Everything <small>${D.items.length}</small></button>`]
    .concat(Object.entries(CATS).filter(([c])=>n[c]).map(([c,[lab,col]])=>`<button class="chip" data-c="${c}" aria-pressed="${st.cat===c}"><i class="sw" style="background:var(${col})"></i>${lab} <small>${n[c]}</small></button>`)).join("");
  $("cats").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c||null;st.shown=60;chips();render()});
}
function seg(id,key,attr){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{st[key]=b.dataset[attr];st.shown=60;
  $(id).querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()})}
seg("kind","kind","k");seg("sort","sort","s");
$("q").oninput=e=>{st.q=e.target.value;st.shown=60;render()};
fetch("data.json").then(r=>r.json()).then(d=>{D=d;
  const v=d.items.filter(i=>i.kind==="video").length,p=d.items.filter(i=>i.cat==="pterodactyl").length;
  $("stats").innerHTML=`<div class="stat"><b>${d.items.length}</b>sightings</div><div class="stat"><b>${v}</b>videos</div><div class="stat"><b>${p}</b>pterodactyls</div>`;
  $("news").innerHTML=d.news.map(n=>`<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><div>${esc(n.src)} · ${ago(n.date)}</div></li>`).join("")||"<li>No headlines right now.</li>";
  $("foot").textContent=`Updated ${new Date(d.updated).toLocaleString()}. Posts belong to the people who shared them; every card links to the original. Nothing here is verified.`;
  chips();render();
}).catch(()=>$("grid").innerHTML='<div class="empty">Could not load sightings.</div>');
</script>
</body>
</html>
