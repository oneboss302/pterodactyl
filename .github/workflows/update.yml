name: Update sightings

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours; Reddit rate-limits anything faster
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [items.json]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pterodactyl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          python3 build.py _site
          cp index.html _site/
          echo "pterodactyl.castafero.com" > _site/CNAME
          touch _site/.nojekyll
      - name: Save the archive (keeps sightings when a source blocks us, and keeps the schedule active)
        run: |
          git add items.json
          git diff --cached --quiet && exit 0
          git config user.name "pterodactyl-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Sightings update $(date -u +'%F %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; sleep 5; done
          echo "::warning::archive not pushed; deploying anyway"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
